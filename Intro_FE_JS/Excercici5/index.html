<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Task List</title>
  </head>
  <body>
    <header><h1>Task List</h1></header>
    <main>
      <section id="add-remove-task">
        <form id="add-task">
          <label for="task">Task: </label>
          <input type="text" id="task" name="task" />
          <input type="submit" value="Add Task" />
        </form>
        <form id="remove-task">
          <label for="id-task">ID Task(number): </label>
          <input type="number" id="id-task" name="id-task" />
          <input type="submit" value="Remove Task" />
        </form>
        <p id="mensajeConfirmacion"></p>
      </section>
      <section id="list">
        <h4>Tasks to do</h4>
      </section>
      <section id="task-count">
        <h5 id="total-tasks">Total tasks: 0</h5>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
